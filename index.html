<!doctype html>
<!--suppress HtmlFormInputWithoutLabel -->
<html class="no-js" lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>durmex.de | DURMEX</title>
  <link rel="stylesheet" href="./style.css">
  <meta name="description" content="durmex">
  <meta property="og:title" content="durmex">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://durmex.de/">
  <meta property="og:image" content="https://www.durmex.de/logo.svg">
  <meta property="og:image:alt" content="durmex">
  <!-- Statusbar-Farbe für iOS -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">

  <link rel="icon" href="logo.svg" sizes="any">
  <link rel="apple-touch-icon" href="logo.svg">
  <link rel="manifest" href="site.webmanifest">
  <meta name="theme-color" content="#c8f53a">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Syne:wght@400;800&display=swap"
        rel="stylesheet"/>
</head>
<body>
<div class="cursor" id="cursor"></div>
<div class="cursor-ring" id="cursorRing"></div>

<canvas id="canvas"></canvas>
<div class="grid-overlay"></div>
<div class="noise"></div>
<div class="scanline"></div>

<div class="orb orb1"></div>
<div class="orb orb2"></div>

<div class="corner tl"></div>
<div class="corner tr"></div>
<div class="corner bl"></div>
<div class="corner br"></div>

<div class="scene">
  <div class="title-wrap">
    <h1 class="title">DURMEX</h1>
    <div class="accent-line">
      <div class="line"></div>
      <div class="dot"></div>
      <div class="line"></div>
    </div>
    <p class="tagline">Something is coming</p>
  </div>
</div>

<div class="status">
  <div class="status-dot"></div>
  <span>In Development</span>
</div>
<script src="./index.js"></script>
</body>
</html>
